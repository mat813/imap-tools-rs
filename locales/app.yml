_version: 2

# Texts used by several modules, or by none of the modules below (the command line
# itself, the startup errors). A text used by a single module lives in the file of that
# module: commands/<command>.yml or libs/<library>.yml.
#
# Every file needs `_version: 2` on its first line, and a key must not be defined in
# two files. `libs::i18n::tests` checks both, and where each key lives.

# ---------------------------------------------------------------------------
# CLI help
# ---------------------------------------------------------------------------

cli.root.about:
  en: A collection of tools to manipulate IMAP mailboxes
  fr: Un ensemble d'outils pour manipuler des boîtes aux lettres IMAP
  de: Eine Sammlung von Werkzeugen zur Verwaltung von IMAP-Postfächern
  ja: IMAP メールボックスを操作するためのツール集
  zh: 用于管理 IMAP 邮箱的工具集
  ko: IMAP 메일박스를 다루는 도구 모음

cli.root.long_about:
  en: |-
    These commands will help you curate your IMAP mailboxes.

    You can remove duplicate emails, clean old emails, or archive them.
  fr: |-
    Ces commandes vous aident à entretenir vos boîtes aux lettres IMAP.

    Vous pouvez supprimer les courriels en double, nettoyer les anciens courriels ou les archiver.
  de: |-
    Mit diesen Befehlen pflegen Sie Ihre IMAP-Postfächer.

    Sie können doppelte E-Mails entfernen, alte E-Mails bereinigen oder archivieren.
  ja: |-
    これらのコマンドは、IMAP メールボックスの整理に役立ちます。

    重複したメールの削除、古いメールの整理、アーカイブができます。
  zh: |-
    这些命令可帮助您整理 IMAP 邮箱。

    您可以删除重复邮件、清理旧邮件或将其归档。
  ko: |-
    이 명령들은 IMAP 메일박스를 정리하는 데 도움이 됩니다.

    중복된 이메일을 삭제하거나, 오래된 이메일을 정리하거나, 보관할 수 있습니다.

cli.imap.about:
  en: Low-level IMAP operations
  fr: Opérations IMAP de bas niveau
  de: Low-Level-IMAP-Operationen
  ja: 低レベルの IMAP 操作
  zh: 底层 IMAP 操作
  ko: 저수준 IMAP 작업

