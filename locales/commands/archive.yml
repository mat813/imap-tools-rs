_version: 2

# Texts of the `archive` command (src/commands/archive.rs).
# Texts that other modules use too are in app.yml.

# ---------------------------------------------------------------------------
# CLI help
# ---------------------------------------------------------------------------

cli.archive.about:
  en: Move old emails to "archive" folders
  fr: Déplacer les anciens courriels vers des dossiers « archive »
  de: Alte E-Mails in „Archiv“-Ordner verschieben
  ja: 古いメールを「アーカイブ」フォルダーに移動する
  zh: 将旧邮件移动到“归档”文件夹
  ko: 오래된 이메일을 "아카이브" 폴더로 이동

cli.archive.long_about:
  en: |-
    This command allows archiving old emails.

    The destination mailbox can be configured, as well as the retention.
  fr: |-
    Cette commande permet d'archiver les anciens courriels.

    La boîte aux lettres de destination peut être configurée, ainsi que la durée de conservation.
  de: |-
    Mit diesem Befehl lassen sich alte E-Mails archivieren.

    Das Zielpostfach sowie die Aufbewahrungsdauer sind konfigurierbar.
  ja: |-
    このコマンドは古いメールをアーカイブします。

    保存先のメールボックスや保持期間は設定で変更できます。
  zh: |-
    此命令用于归档旧邮件。

    可以配置目标邮箱以及保留期限。
  ko: |-
    이 명령은 오래된 이메일을 보관합니다.

    대상 메일박스와 보존 기간을 설정할 수 있습니다.

