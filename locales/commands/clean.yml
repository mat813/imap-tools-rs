_version: 2

# Texts of the `clean` command (src/commands/clean.rs).
# Texts that other modules use too are in app.yml.

# ---------------------------------------------------------------------------
# CLI help
# ---------------------------------------------------------------------------

cli.clean.about:
  en: Delete old messages
  fr: Supprimer les anciens messages
  de: Alte Nachrichten löschen
  ja: 古いメッセージを削除する
  zh: 删除旧邮件
  ko: 오래된 메시지 삭제

cli.clean.long_about:
  en: |-
    This command allows removing old messages from mailboxes.

    It can be configured to keep more messages if they don't take too much space.
  fr: |-
    Cette commande permet de supprimer les anciens messages des boîtes aux lettres.

    Elle peut être configurée pour conserver davantage de messages s'ils ne prennent pas trop de place.
  de: |-
    Mit diesem Befehl lassen sich alte Nachrichten aus Postfächern entfernen.

    Er kann so konfiguriert werden, dass mehr Nachrichten behalten werden, wenn sie nicht zu viel Platz belegen.
  ja: |-
    このコマンドはメールボックスから古いメッセージを削除します。

    容量をあまり使わない場合は、より多くのメッセージを残すように設定できます。
  zh: |-
    此命令用于从邮箱中删除旧邮件。

    可以配置为：当邮件占用空间不大时保留更多邮件。
  ko: |-
    이 명령은 메일박스에서 오래된 메시지를 삭제합니다.

    용량을 많이 차지하지 않는 경우 더 많은 메시지를 보관하도록 설정할 수 있습니다.

