# ---------------------------------------------------------------------------
# Command output
# ---------------------------------------------------------------------------

output.imap_create.created:
  en: The mailbox %{mailbox} has been created
  fr: La boîte aux lettres %{mailbox} a été créée
  de: Das Postfach %{mailbox} wurde erstellt
  ja: メールボックス %{mailbox} を作成しました
  zh: 已创建邮箱 %{mailbox}
  ko: 메일박스 %{mailbox}을(를) 생성했습니다

output.imap_create.already_exists:
  en: "Cannot create %{mailbox}, it already exists: %{reason}"
  fr: "Impossible de créer %{mailbox}, elle existe déjà : %{reason}"
  de: "%{mailbox} kann nicht erstellt werden, es existiert bereits: %{reason}"
  ja: "%{mailbox} を作成できません。すでに存在します: %{reason}"
  zh: "无法创建 %{mailbox}，它已存在：%{reason}"
  ko: "%{mailbox}을(를) 생성할 수 없습니다. 이미 존재합니다: %{reason}"

output.imap_delete.removed:
  en: The mailbox %{mailbox} has been removed
  fr: La boîte aux lettres %{mailbox} a été supprimée
  de: Das Postfach %{mailbox} wurde entfernt
  ja: メールボックス %{mailbox} を削除しました
  zh: 已删除邮箱 %{mailbox}
  ko: 메일박스 %{mailbox}을(를) 삭제했습니다

output.imap_delete.not_found:
  en: "Cannot remove %{mailbox}, it does not exist: %{reason}"
  fr: "Impossible de supprimer %{mailbox}, elle n'existe pas : %{reason}"
  de: "%{mailbox} kann nicht entfernt werden, es existiert nicht: %{reason}"
  ja: "%{mailbox} を削除できません。存在しません: %{reason}"
  zh: "无法删除 %{mailbox}，它不存在：%{reason}"
  ko: "%{mailbox}을(를) 삭제할 수 없습니다. 존재하지 않습니다: %{reason}"
