_version: 2

# Texts of the `imap` subcommands: create, delete, disk-usage and list (src/commands/imap/).
# Texts that other modules use too are in app.yml.

# ---------------------------------------------------------------------------
# CLI help
# ---------------------------------------------------------------------------

cli.imap.list.about:
  en: List mailboxes
  fr: Lister les boîtes aux lettres
  de: Postfächer auflisten
  ja: メールボックスを一覧表示する
  zh: 列出邮箱
  ko: 메일박스 나열

cli.imap.list.long_about:
  en: This command allows listing mailboxes.
  fr: Cette commande permet de lister les boîtes aux lettres.
  de: Mit diesem Befehl lassen sich Postfächer auflisten.
  ja: このコマンドはメールボックスを一覧表示します。
  zh: 此命令用于列出邮箱。
  ko: 이 명령은 메일박스를 나열합니다.

cli.imap.create.about:
  en: Create mailbox
  fr: Créer une boîte aux lettres
  de: Postfach erstellen
  ja: メールボックスを作成する
  zh: 创建邮箱
  ko: 메일박스 생성

cli.imap.create.long_about:
  en: This command creates a mailbox.
  fr: Cette commande crée une boîte aux lettres.
  de: Dieser Befehl erstellt ein Postfach.
  ja: このコマンドはメールボックスを作成します。
  zh: 此命令用于创建邮箱。
  ko: 이 명령은 메일박스를 생성합니다.

cli.imap.create.mailbox:
  en: The mailbox to create
  fr: La boîte aux lettres à créer
  de: Das zu erstellende Postfach
  ja: 作成するメールボックス
  zh: 要创建的邮箱
  ko: 생성할 메일박스

cli.imap.delete.about:
  en: Delete mailbox
  fr: Supprimer une boîte aux lettres
  de: Postfach löschen
  ja: メールボックスを削除する
  zh: 删除邮箱
  ko: 메일박스 삭제

cli.imap.delete.long_about:
  en: This command deletes a mailbox.
  fr: Cette commande supprime une boîte aux lettres.
  de: Dieser Befehl löscht ein Postfach.
  ja: このコマンドはメールボックスを削除します。
  zh: 此命令用于删除邮箱。
  ko: 이 명령은 메일박스를 삭제합니다.

cli.imap.delete.mailbox:
  en: The mailbox to delete
  fr: La boîte aux lettres à supprimer
  de: Das zu löschende Postfach
  ja: 削除するメールボックス
  zh: 要删除的邮箱
  ko: 삭제할 메일박스

cli.imap.disk_usage.about:
  en: Show mailbox disk usage
  fr: Afficher l'espace disque utilisé par les boîtes aux lettres
  de: Speicherplatzbelegung der Postfächer anzeigen
  ja: メールボックスのディスク使用量を表示する
  zh: 显示邮箱的磁盘使用情况
  ko: 메일박스의 디스크 사용량 표시

cli.imap.disk_usage.long_about:
  en: This command shows the disk usage of each mailbox.
  fr: Cette commande affiche l'espace disque utilisé par chaque boîte aux lettres.
  de: Dieser Befehl zeigt die Speicherplatzbelegung jedes Postfachs an.
  ja: このコマンドは各メールボックスのディスク使用量を表示します。
  zh: 此命令显示每个邮箱的磁盘使用情况。
  ko: 이 명령은 각 메일박스의 디스크 사용량을 표시합니다.

cli.imap.disk_usage.sort:
  en: Sort results
  fr: Trier les résultats
  de: Ergebnisse sortieren
  ja: 結果を並べ替える
  zh: 对结果排序
  ko: 결과 정렬

cli.imap.disk_usage.progress:
  en: Show progress bar
  fr: Afficher la barre de progression
  de: Fortschrittsanzeige einblenden
  ja: プログレスバーを表示する
  zh: 显示进度条
  ko: 진행률 표시줄 표시

cli.sort.name:
  en: Sort by mailbox name, ascending
  fr: Trier par nom de boîte aux lettres, croissant
  de: Nach Postfachname aufsteigend sortieren
  ja: メールボックス名の昇順で並べ替え
  zh: 按邮箱名称升序排序
  ko: 메일박스 이름 오름차순 정렬

cli.sort.name_desc:
  en: Sort by mailbox name, descending
  fr: Trier par nom de boîte aux lettres, décroissant
  de: Nach Postfachname absteigend sortieren
  ja: メールボックス名の降順で並べ替え
  zh: 按邮箱名称降序排序
  ko: 메일박스 이름 내림차순 정렬

cli.sort.size:
  en: Sort by mailbox size, ascending
  fr: Trier par taille de boîte aux lettres, croissant
  de: Nach Postfachgröße aufsteigend sortieren
  ja: メールボックスのサイズの昇順で並べ替え
  zh: 按邮箱大小升序排序
  ko: 메일박스 크기 오름차순 정렬

cli.sort.size_desc:
  en: Sort by mailbox size, descending
  fr: Trier par taille de boîte aux lettres, décroissant
  de: Nach Postfachgröße absteigend sortieren
  ja: メールボックスのサイズの降順で並べ替え
  zh: 按邮箱大小降序排序
  ko: 메일박스 크기 내림차순 정렬

# Arguments of the mailbox listing commands (`list`, `imap list`, `imap disk-usage`).
cli.filter.include_re:
  en: Only include folder paths matching this regex
  fr: Inclure uniquement les chemins de dossiers correspondant à cette expression régulière
  de: Nur Ordnerpfade einbeziehen, die diesem regulären Ausdruck entsprechen
  ja: この正規表現に一致するフォルダーパスのみを含める
  zh: 仅包含匹配此正则表达式的文件夹路径
  ko: 이 정규식과 일치하는 폴더 경로만 포함

cli.filter.exclude_re:
  en: Exclude folder paths matching this regex
  fr: Exclure les chemins de dossiers correspondant à cette expression régulière
  de: Ordnerpfade ausschließen, die diesem regulären Ausdruck entsprechen
  ja: この正規表現に一致するフォルダーパスを除外する
  zh: 排除匹配此正则表达式的文件夹路径
  ko: 이 정규식과 일치하는 폴더 경로 제외

cli.filter.no_select:
  en: 'Include `NoSelect` "folders"'
  fr: 'Inclure les « dossiers » `NoSelect`'
  de: '`NoSelect`-„Ordner“ einbeziehen'
  ja: '`NoSelect` の「フォルダー」を含める'
  zh: '包含 `NoSelect`“文件夹”'
  ko: '`NoSelect` "폴더" 포함'

cli.filter.pattern:
  en: IMAP pattern
  fr: Motif IMAP
  de: IMAP-Muster
  ja: IMAP パターン
  zh: IMAP 模式
  ko: IMAP 패턴

cli.filter.reference:
  en: IMAP reference list
  fr: Liste de références IMAP
  de: IMAP-Referenzliste
  ja: IMAP 参照リスト
  zh: IMAP 引用列表
  ko: IMAP 참조 목록

