_version: 2

# Texts of the `find-dups` command (src/commands/find_dups.rs).
# Texts that other modules use too are in app.yml.

# ---------------------------------------------------------------------------
# CLI help
# ---------------------------------------------------------------------------

cli.find_dups.about:
  en: Remove duplicate emails
  fr: Supprimer les courriels en double
  de: Doppelte E-Mails entfernen
  ja: 重複したメールを削除する
  zh: 删除重复邮件
  ko: 중복된 이메일 삭제

cli.find_dups.long_about:
  en: |-
    This will clean up your mailboxes of duplicate emails.

    It will search each mailbox and if a message with the same message ID is found,
    it will delete the duplicates.
  fr: |-
    Cette commande nettoie vos boîtes aux lettres des courriels en double.

    Elle parcourt chaque boîte aux lettres et, si un message avec le même identifiant
    de message est trouvé, elle supprime les doublons.
  de: |-
    Dieser Befehl bereinigt Ihre Postfächer von doppelten E-Mails.

    Er durchsucht jedes Postfach und löscht die Duplikate, wenn eine Nachricht
    mit derselben Message-ID gefunden wird.
  ja: |-
    このコマンドはメールボックスから重複したメールを整理します。

    各メールボックスを検索し、同じメッセージ ID のメッセージが見つかった場合は、重複分を削除します。
  zh: |-
    此命令用于清理邮箱中的重复邮件。

    它会搜索每个邮箱，如果发现具有相同邮件 ID 的邮件，就会删除重复项。
  ko: |-
    이 명령은 메일박스에서 중복된 이메일을 정리합니다.

    각 메일박스를 검색하여 동일한 메시지 ID를 가진 메시지가 발견되면 중복된 메시지를 삭제합니다.

