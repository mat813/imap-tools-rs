[package]
name = "imap-tools"
version = "1.13.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A collection of tools to manipulate IMAP mailboxes"
readme = "README.md"
keywords = ["IMAP"]
homepage = "https://gitlab.com/mat813/imap-tools-rs"
repository = "https://gitlab.com/mat813/imap-tools-rs"

[package.metadata.i18n]
available-locales = ["en", "fr", "de", "ja", "zh", "ko"]
default-locale = "en"
load-path = "locales"

[package.metadata.binstall]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "zip"

[features]
default = ["rustls", "tracing"]
__tls = []
native-tls = ["dep:tokio-native-tls", "dep:native-tls", "__tls"]
rustls  = ["dep:tokio-rustls", "dep:rustls-native-certs", "__tls"]
ratatui = ["dep:ratatui"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "regex/logging"]
cursive = ["dep:cursive"]

[dependencies]
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
better-cursive-table = "=0.3.0"
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive", "env"] }
csv = "=1.4.0"
cursive = { version = "=0.21.1", optional = true, default-features = false, features = ["crossterm-backend"] }
derive_more = { version = "=2.1.1", features = ["debug", "display", "from", "into"] }
exn = "=0.3.1"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
hmac = "=0.13.0"
indicatif = "=0.18.6"
md-5 = "=0.11.0"
native-tls = { version = "=0.2.18", optional = true }
ratatui = { version = "=0.30.2", optional = true }
regex = "=1.13.1"
rsasl = { version = "=2.3.1", default-features = false, features = ["std", "provider", "config_builder", "scram-sha-1", "scram-sha-2"] }
rust-i18n = "=4.2.3"
rustls-native-certs = { version = "=0.8.4", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde-value = "=0.7.0"
serde_any = { version = "=0.5.0", default-features = false, features = ["json", "toml", "yaml"] }
serde_json = { version = "=1.0.151" }
shell-words = "=1.1.1"
size = { version = "=0.5.0", features = ["serde"] }
strfmt = "=0.2.6"
sys-locale = "=0.3.2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-native-tls = { version = "=0.3.1", optional = true }
tokio-rustls = { version = "=0.26.6", optional = true }
tracing = { version = "=0.1.44", features = ["log"], optional = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"], optional = true }
unicode-width = "=0.2.2"

[dev-dependencies]
insta = "=1.48.0"
rstest = "=0.27.0"
tempfile = "=3.27.0"

# cargo watch -x "build --profile dev-rustls --no-default-features -F rustls" -x "build --profile dev-openssl --no-default-features -F openssl"
[profile.dev-openssl]
inherits = "dev"

[profile.dev-rustls]
inherits = "dev"

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
create_dir = "warn"
dbg_macro = "warn"
else_if_without_else = "warn"
exit = "deny"
expect_used = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
integer_division = "warn"
match_like_matches_macro = "warn"
match_same_arms = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
missing_docs_in_private_items = "warn"
multiple_inherent_impl = "warn"
needless_raw_strings = "warn"
nursery = { level = "warn", priority = -1 }
option_as_ref_deref = "warn"
panic = "deny"
pathbuf_init_then_push = "warn"
pattern_type_mismatch = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_slice = "warn"
todo = "warn"
try_err = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
unused_trait_names = "deny"
unwrap_in_result = "warn"
unwrap_used = "warn"
